<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flugwetter – Markbachjoch Startplatz 3</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e3e6; --accent:#0b5cad; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; color:var(--ink); background:#fff; }
  header { padding:10px 12px 6px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
  header h1 { font-size:18px; margin:0; font-weight:700; }
  header .meta { color:var(--muted); font-size:14px; }
  .btns { display:flex; gap:6px; margin-left:auto; }
  .btn { border:1px solid var(--line); background:#fafafa; border-radius:16px; padding:5px 11px; font:inherit; font-size:14px; color:var(--ink); text-decoration:none; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .btn:hover { background:#f0f0f2; }
  .btn.info { width:30px; height:30px; padding:0; justify-content:center; font-weight:700; font-style:italic; font-family:Georgia, serif; }
  nav#days { display:flex; gap:6px; padding:0 12px 6px; flex-wrap:wrap; align-items:center; }
  nav#days button { border:1px solid var(--line); background:#fff; border-radius:18px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer; }
  nav#days button.on { background:#0b2e59; color:#fff; border-color:#0b2e59; }
  #runinfo { color:var(--muted); font-size:13px; margin-left:6px; }
  #status { padding:4px 12px; color:var(--muted); font-size:14px; }
  #status.err { color:#b00020; }
  #chartWrap { position:relative; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  #chart svg { display:block; user-select:none; -webkit-user-select:none; }
  #chart text { font-family: inherit; }
  .hit { cursor:pointer; }
  #popup { position:absolute; z-index:5; background:#efefef; border:1px solid #cfcfcf; border-left:5px solid #0b2e59; border-radius:8px;
           box-shadow:0 4px 14px rgba(0,0,0,.18); padding:8px 12px 8px 10px; font-size:14px; min-width:220px; max-width:320px; }
  #popup .t { font-weight:700; font-size:15px; margin-bottom:4px; padding-right:18px; }
  #popup .t span { color:var(--muted); font-weight:400; margin-left:8px; }
  #popup .g { display:grid; grid-template-columns:auto auto; gap:2px 14px; }
  #popup .g div:nth-child(odd) { color:var(--muted); }
  #popup .note { color:var(--muted); font-size:12px; margin-top:6px; border-top:1px solid #d6d6d6; padding-top:4px; }
  #popup .x { position:absolute; right:6px; top:2px; border:0; background:none; font-size:18px; cursor:pointer; color:var(--muted); }
  #legend { padding:10px 12px 24px; font-size:13px; color:var(--muted); line-height:1.45; max-width:900px; }
  #legend .scale { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 8px; align-items:center; }
  #legend .sw { display:inline-block; padding:1px 7px; border-radius:4px; font-size:12px; }
  #legend h3 { font-size:14px; color:var(--ink); margin:10px 0 2px; }
  #infoPanel { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-start; justify-content:center; z-index:20; padding:4vh 10px; }
  #infoPanel[hidden] { display:none; }
  #infoPanel .card { background:#fff; border-radius:12px; max-width:560px; width:100%; max-height:90vh; overflow:auto; padding:14px 16px; box-shadow:0 8px 30px rgba(0,0,0,.25); }
  #infoPanel h2 { font-size:18px; margin:0 0 8px; }
  #infoPanel h3 { font-size:15px; margin:14px 0 4px; }
  #infoPanel table { border-collapse:collapse; font-size:14px; width:100%; }
  #infoPanel td { padding:3px 6px 3px 0; vertical-align:top; }
  #infoPanel td:first-child { color:var(--muted); white-space:nowrap; width:1%; padding-right:12px; }
  #infoPanel .close { float:right; }
  #infoPanel .src { color:var(--muted); font-size:12px; margin-top:12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="siteName">–</h1>
    <div class="meta" id="siteMeta"></div>
  </div>
  <div class="btns">
    <button class="btn info" id="btnInfo" title="Infos zum Startplatz">i</button>
    <a class="btn" id="lnkDhv" target="_blank" rel="noopener">DHV</a>
    <a class="btn" id="lnkNav" target="_blank" rel="noopener">🧭 Navigation</a>
  </div>
</header>
<nav id="days"></nav>
<div id="status">Lade Wetterdaten …</div>
<div id="chartWrap"><div id="chart"></div><div id="popup" hidden></div></div>
<section id="legend"></section>

<div id="infoPanel" hidden><div class="card" id="infoCard"></div></div>

<script>
/* ===================== Einstellungen ===================== */
// Startplatz – kann per URL überschrieben werden: ?lat=..&lon=..&alt=..&name=..&dir=..&demo=1
const SITE = {
  name: "Markbachjoch Startplatz 3 (Rosskopf)",
  lat: 47.425833, lon: 12.070442, alt: 1704,
  dir: "N-NO",
  dhvUrl: "https://service.dhv.de/db2/details.php?qi=glp_details&item=1313",
  info: {
    "Art": "Startplatz (Hang)",
    "Bundesland / Gemeinde": "Tirol, 6314 Niederau",
    "Koordinaten": "N 47°25'33.00\" E 12°04'13.59\"",
    "Höhe NN": "1704 m",
    "Startrichtung": "N-NO",
    "Erschließung": "per Bergbahn, zu Fuß",
    "Gleitschirm": "1- und 2-sitzig, einfach",
    "Hängegleiter": "nein",
    "Bemerkung": "Zum Startplatz am Rosskopf sollte man einen Fußmarsch von knapp einer Stunde einplanen."
  },
  gelaende: {
    "Gelände": "Markbachjoch Wildschönau",
    "Eignung": "Hanggelände für Gleitschirme und Hängegleiter",
    "Höhendifferenz": "862 m",
    "Bemerkung": "Einsteiger- und Genussgelände, nicht dem Inntal-Talwind ausgesetzt. Große Startwiese unterhalb der bewirtschafteten Berghütte, große Landewiese. Wird für die Höhenflugausbildung der Flugschule Wildschönau genutzt.",
    "Flugschule": "Flugschule Wildschönau, Niederau – Tel. +43 5339 8024, mobil +43 664 2622646",
    "Bergbahn": "Wildschönauer Bergbahnen – Tel. +43 5339 5353-0"
  },
  landing: [
    { name:"Markbachjoch Landeplatz 1", lat:47.446753, lon:12.100303, alt:856, text:"Großer Landeplatz am Ortsrand von Niederau, auch Schulung." },
    { name:"Markbachjoch Landeplatz 2", lat:47.447203, lon:12.093544, alt:842, text:"Kleiner Landeplatz neben der Talstation, nur Gleitschirm." }
  ]
};

const CONFIG = {
  // Farbschwellen in km/h (Untergrenzen: gelb, orange, rot, schwarz)
  windSteps: [12, 20, 30, 38],
  gustSteps: [25, 35, 40, 45],
  colors: ["#2fc42f", "#ffe100", "#ff8a00", "#d40000", "#111111"],
  ueberhitzung: 1.0,       // K, Auslöseüberhitzung für die Thermikberechnung
  hollowBelow: 4,          // km/h, darunter Pfeil nur umrandet
  pressureLevels: [1000, 975, 950, 925, 900, 850, 800, 700, 600, 500],
  modelsD2: ["icon_d2", "dwd_icon_d2"],   // erster gültiger Name wird verwendet
  modelsEU: ["icon_eu", "dwd_icon_eu"],
  modelsGL: ["icon_global", "dwd_icon_global"],
  days: 7,
  gustDecay: 600,          // m über Thermikobergrenze, in denen der Böenanteil auf 0 abnimmt
  gustMinFactor: 1.1,      // Böen mindestens Wind × Faktor
};

/* ===================== URL-Parameter ===================== */
const Q = new URLSearchParams(location.search);
if (Q.get("lat")) {
  SITE.lat = +Q.get("lat"); SITE.lon = +Q.get("lon"); SITE.alt = +(Q.get("alt") || 0);
  SITE.name = Q.get("name") || "Startplatz"; SITE.dir = Q.get("dir") || "";
  SITE.dhvUrl = Q.get("dhv") || ""; SITE.info = null; SITE.gelaende = null; SITE.landing = [];
}
const DEMO = Q.get("demo") === "1";

/* ===================== Hilfsfunktionen ===================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DIRS = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const dirName = d => DIRS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
function colorFor(v, steps) { let i = 0; while (i < steps.length && v >= steps[i]) i++; return CONFIG.colors[i]; }
const windColor = v => colorFor(v, CONFIG.windSteps);
const gustColor = v => colorFor(v, CONFIG.gustSteps);
function textOn(bg) { return (bg === CONFIG.colors[0] || bg === CONFIG.colors[1]) ? "#111" : "#fff"; }
function darker(hex, f = 0.62) {
  const n = parseInt(hex.slice(1), 16); const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}
function dewPoint(T, RH) {
  if (T == null || RH == null || RH <= 0) return null;
  const a = 17.62, b = 243.12, g = Math.log(RH / 100) + a * T / (b + T);
  return b * g / (a - g);
}
function mix(c1, c2, t) {
  const p = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const A = p(c1), B = p(c2);
  return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")})`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ===================== Sonnenstand: bürgerliche Dämmerung ===================== */
// Liefert Minuten seit Mitternacht UTC für Morgen- und Abenddämmerung (Sonne −6°)
function civilTwilight(y, m, d, lat, lon) {
  const rad = Math.PI / 180;
  const jd = Date.UTC(y, m - 1, d, 12) / 86400000 + 2440587.5;
  const n = jd - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = (357.528 + 0.9856003 * n) % 360;
  const lam = L + 1.915 * Math.sin(g * rad) + 0.02 * Math.sin(2 * g * rad);
  const eps = 23.439 - 0.0000004 * n;
  const decl = Math.asin(Math.sin(eps * rad) * Math.sin(lam * rad));
  const ra = Math.atan2(Math.cos(eps * rad) * Math.sin(lam * rad), Math.cos(lam * rad)) / rad;
  let eqt = (L - ((ra + 360) % 360)); if (eqt > 180) eqt -= 360; if (eqt < -180) eqt += 360; // Grad
  const noon = 720 - 4 * lon - 4 * eqt; // Minuten UTC
  const cosH = (Math.sin(-6 * rad) - Math.sin(lat * rad) * Math.sin(decl)) / (Math.cos(lat * rad) * Math.cos(decl));
  const H = Math.acos(clamp(cosH, -1, 1)) / rad;
  return { dawn: noon - 4 * H, dusk: noon + 4 * H };
}

/* ===================== Daten holen ===================== */
const SURF = ["temperature_2m","dew_point_2m","relative_humidity_2m","precipitation","weather_code",
  "cloud_cover_low","cloud_cover_mid","cloud_cover_high","wind_speed_10m","wind_direction_10m",
  "wind_gusts_10m","surface_pressure","is_day"];
const PLV = ["temperature","relative_humidity","cloud_cover","wind_speed","wind_direction","geopotential_height"];

function apiUrl(model) {
  const hourly = [...SURF, ...CONFIG.pressureLevels.flatMap(p => PLV.map(v => `${v}_${p}hPa`))].join(",");
  return "https://api.open-meteo.com/v1/forecast?latitude=" + SITE.lat + "&longitude=" + SITE.lon +
    "&elevation=nan&models=" + model + "&timezone=auto&forecast_days=" + CONFIG.days + "&wind_speed_unit=kmh&hourly=" + hourly;
}
async function fetchModel(names) {
  let reason = "";
  for (const m of names) {
    try {
      const r = await fetch(apiUrl(m));
      const j = await r.json();
      if (!j.error) { j._model = m; return j; }
      reason = j.reason;
    } catch (e) { reason = e.message; }
  }
  throw new Error(reason);
}
async function fetchRun() {
  try {
    const r = await fetch("https://api.open-meteo.com/data/dwd_icon_d2/static/meta.json");
    const j = await r.json();
    return j.last_run_initialisation_time ? new Date(j.last_run_initialisation_time * 1000) : null;
  } catch { return null; }
}

/* ===================== Testdaten (?demo=1) ===================== */
function makeDemo(model) {
  const isD2 = model === "d2", isEU = model === "eu";
  const ground = isD2 ? 1210 : (isEU ? 1090 : 980);
  const now = new Date(); const y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
  const H = { time: [] }; [...SURF, ...CONFIG.pressureLevels.flatMap(p => PLV.map(v => `${v}_${p}hPa`))].forEach(k => H[k] = []);
  for (let i = 0; i < 24 * CONFIG.days; i++) {
    const dt = new Date(y, mo, d, i); const h = dt.getHours(), day = Math.floor(i / 24) % 3;
    H.time.push(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}T${String(h).padStart(2,"0")}:00`);
    const cut = (isD2 && i >= 48) || (isEU && i >= 120);
    const put = (k, v) => H[k].push(cut ? null : v);
    const sun = Math.max(0, Math.sin(Math.PI * (h - 7.5) / 9.5));
    const T2 = 1 + day * 1.5 + 8 * sun - (sun ? 0 : 1.5);
    const spread = 2 + 6 * sun - day;
    const rain = day === 1 && h >= 13 && h <= 17 ? 0.2 + 0.25 * (h - 12) : 0;
    const ccLowBase = h < 9 ? 70 - h * 6 : 5;
    put("temperature_2m", T2); put("dew_point_2m", T2 - spread); put("relative_humidity_2m", clamp(100 - spread * 6, 30, 100));
    put("precipitation", rain); put("is_day", h >= 7 && h <= 16 ? 1 : 0);
    put("wind_speed_10m", 4 + 6 * sun + day * 3); put("wind_direction_10m", 20 + 30 * sun);
    put("wind_gusts_10m", (4 + 6 * sun + day * 3) * 1.9); put("surface_pressure", 1013.25 * Math.pow(1 - ground / 44330, 5.255));
    const ccMid = day === 1 ? clamp((h - 9) * 15, 0, 90) : (day === 2 ? 40 : 10);
    const ccHigh = 30 + 20 * Math.sin(i / 7);
    put("cloud_cover_low", ccLowBase + (rain ? 50 : 0)); put("cloud_cover_mid", ccMid); put("cloud_cover_high", clamp(ccHigh, 0, 100));
    put("weather_code", rain ? 61 : (ccLowBase > 50 ? 45 : (ccMid > 60 ? 3 : (ccHigh > 40 ? 2 : 1))));
    for (const p of CONFIG.pressureLevels) {
      const z = 44330 * (1 - Math.pow(p / 1013.25, 0.1903));
      let T = T2 - (z - ground) * (0.006 + 0.003 * sun);
      if (!sun && z > ground && z < ground + 500) T = T2 + (z - ground) * 0.003;
      const layer = Math.exp(-Math.pow((z - (2200 - day * 200)) / 350, 2)) * ccMid;
      const low = z < ground + 400 ? ccLowBase : 0;
      put(`temperature_${p}hPa`, T); put(`geopotential_height_${p}hPa`, z);
      put(`relative_humidity_${p}hPa`, clamp(60 + layer * 0.4, 5, 100));
      put(`cloud_cover_${p}hPa`, clamp(Math.max(layer, low), 0, 100));
      put(`wind_speed_${p}hPa`, Math.max(1, 5 + (z - 1000) / 100 * (1.2 + day) + 4 * sun));
      put(`wind_direction_${p}hPa`, (40 + (z - 1000) / 3000 * 210 + 360) % 360);
    }
  }
  return { latitude: SITE.lat, longitude: SITE.lon, elevation: ground, utc_offset_seconds: -new Date().getTimezoneOffset() * 60,
           timezone: "Demo", hourly: H, _model: "demo-" + model };
}

/* ===================== Aufbereitung ===================== */
function validAt(j, i) { const h = j.hourly; return h.wind_speed_10m[i] != null && h[`wind_speed_${CONFIG.pressureLevels[5]}hPa`][i] != null; }

// Modellkette: ICON-D2 → ICON-EU → ICON-Global (jeweils das feinste verfügbare)
function buildRecords(chain) {
  const srcs = chain.filter(c => c.data).map(c => ({ ...c, idx: new Map(c.data.hourly.time.map((t, i) => [t, i])) }));
  const times = [...new Set(srcs.flatMap(s => s.data.hourly.time))].sort();
  const out = [];
  times.forEach(t => {
    let src = null, idx = 0, model = "";
    for (const s of srcs) {
      if (s.idx.has(t) && validAt(s.data, s.idx.get(t))) { src = s.data; idx = s.idx.get(t); model = s.name; break; }
    }
    if (!src) return;
    const h = src.hourly, g = k => h[k] ? h[k][idx] : null;
    const ground = src.elevation;
    const rec = { time: t, date: t.slice(0, 10), hour: +t.slice(11, 13), model, ground,
      T2: g("temperature_2m"), Td2: g("dew_point_2m"), RH2: g("relative_humidity_2m"), precip: g("precipitation") || 0,
      code: g("weather_code"), isDay: g("is_day"), ccL: g("cloud_cover_low"), ccM: g("cloud_cover_mid"), ccH: g("cloud_cover_high"),
      ws10: g("wind_speed_10m"), wd10: g("wind_direction_10m"), gust10: g("wind_gusts_10m"), ps: g("surface_pressure"), levels: [] };
    if (rec.Td2 == null) rec.Td2 = dewPoint(rec.T2, rec.RH2);
    for (const p of CONFIG.pressureLevels) {
      const z = g(`geopotential_height_${p}hPa`), ws = g(`wind_speed_${p}hPa`);
      if (z == null || ws == null || z <= ground + 5) continue; // unter Modellgrund
      rec.levels.push({ p, z, T: g(`temperature_${p}hPa`), RH: g(`relative_humidity_${p}hPa`), cc: g(`cloud_cover_${p}hPa`) || 0,
                        ws, wd: g(`wind_direction_${p}hPa`) });
    }
    rec.levels.sort((a, b) => a.z - b.z);
    // Bodenniveau (10 m über Modellgrund) als unterste Stützstelle
    const first = rec.levels[0] || {};
    rec.levels.unshift({ p: rec.ps || first.p, z: ground + 10, T: rec.T2, RH: rec.RH2,
      cc: rec.code === 45 || rec.code === 48 ? 100 : (first.cc || 0), ws: rec.ws10, wd: rec.wd10, surface: true });
    rec.base = calcBase(rec);
    rec.start = calcStart(rec);
    out.push(rec);
  });
  return out;
}

// Profilwert in Höhe z (lineare Interpolation, Wind über u/v, Druck logarithmisch)
function prof(rec, z) {
  const L = rec.levels;
  if (!L.length) return null;
  let a = L[0], b = L[0];
  if (z <= L[0].z) { a = b = L[0]; }
  else if (z >= L[L.length - 1].z) { a = b = L[L.length - 1]; }
  else { for (let i = 0; i < L.length - 1; i++) if (z >= L[i].z && z <= L[i + 1].z) { a = L[i]; b = L[i + 1]; break; } }
  const t = a === b ? 0 : (z - a.z) / (b.z - a.z);
  const lin = (x, y) => (x == null ? y : y == null ? x : x + (y - x) * t);
  const rd = Math.PI / 180;
  const ua = -a.ws * Math.sin(a.wd * rd), va = -a.ws * Math.cos(a.wd * rd);
  const ub = -b.ws * Math.sin(b.wd * rd), vb = -b.ws * Math.cos(b.wd * rd);
  const u = lin(ua, ub), v = lin(va, vb);
  let ws = lin(a.ws, b.ws); // Betrag linear (sonst Abschwächung bei Drehung)
  const wd = (Math.atan2(-u, -v) / rd + 360) % 360;
  const T = lin(a.T, b.T), RH = lin(a.RH, b.RH);
  const p = (a.p && b.p) ? Math.exp(lin(Math.log(a.p), Math.log(b.p))) : null;
  return { z, T, RH, Td: dewPoint(T, RH), cc: lin(a.cc, b.cc), ws, wd, p };
}

// Basis: Kondensationsniveau (125 m/K Spread) oder trockene Thermikobergrenze – der niedrigere Wert
function calcBase(rec) {
  if (rec.T2 == null || rec.Td2 == null) return null;
  const z0 = rec.ground, T0 = rec.T2 + CONFIG.ueberhitzung;
  const lcl = z0 + 125 * Math.max(0, rec.T2 - rec.Td2);
  let top = z0;
  for (let z = z0 + 25; z <= 6000; z += 25) {
    const e = prof(rec, z); const Tp = T0 - 0.0098 * (z - z0);
    if (Tp < e.T) { top = z; break; }
    top = z;
  }
  return { base: Math.round(Math.min(lcl, top)), lcl: Math.round(lcl), top: Math.round(top), cumulus: lcl <= top };
}

// Böen in der Höhe (geschätzt): Kein Modell liefert Böen auf Druckflächen. Der Böenanteil am Boden
// (Böe − Mittelwind, 10 m) wird innerhalb der durchmischten Schicht (bis Thermikobergrenze) übernommen
// und nimmt darüber über CONFIG.gustDecay Meter auf 0 ab. Mindestens Wind × gustMinFactor.
function gustAt(rec, z, ws) {
  const excess = Math.max(0, (rec.gust10 || 0) - (rec.ws10 || 0));
  const top = Math.max(rec.base ? rec.base.top : rec.ground, rec.ground + 300);
  const f = z <= top ? 1 : clamp(1 - (z - top) / CONFIG.gustDecay, 0, 1);
  return Math.max(ws * CONFIG.gustMinFactor, ws + excess * f);
}

// Wind & Temperatur am Startplatz
function calcStart(rec) {
  const below = SITE.alt <= rec.ground + 10;
  if (below) {
    const T = rec.T2 != null ? rec.T2 + (rec.ground - SITE.alt) * 0.0065 : null;
    return { below, ws: rec.ws10, wd: rec.wd10, gust: Math.max(rec.gust10 || 0, rec.ws10 || 0), T, Td: rec.Td2, RH: rec.RH2, gustEstimated: false };
  }
  const p = prof(rec, SITE.alt);
  return { below, ws: p.ws, wd: p.wd, gust: gustAt(rec, SITE.alt, p.ws), T: p.T, Td: p.Td, RH: p.RH, p: p.p, gustEstimated: true };
}

/* ===================== Wettersymbole ===================== */
const CLOUD = "M-9,7 L9,7 A5.5,5.5 0 0 0 9.6,-3.9 A7.5,7.5 0 0 0 -4.6,-5.2 A6,6 0 0 0 -9,7 Z";
function iconSvg(code, isDay, x, y, s) {
  const sun = `<g><circle r="5.2" fill="#f6b400"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="0" y1="-7.5" x2="0" y2="-10" stroke="#f6b400" stroke-width="1.8" stroke-linecap="round" transform="rotate(${a})"/>`).join("")}</g>`;
  const moon = `<path d="M3,-7 A7.5,7.5 0 1 0 7,4 A6,6 0 1 1 3,-7 Z" fill="#9aa3ad"/>`;
  const cloud = (fill, tx = 0, ty = 0, sc = 1) => `<path d="${CLOUD}" fill="${fill}" transform="translate(${tx},${ty}) scale(${sc})"/>`;
  let g = "";
  const c = code ?? 0;
  if (c === 0) g = isDay ? sun : moon;
  else if (c <= 2) g = `<g transform="translate(-4,-4) scale(.85)">${isDay ? sun : moon}</g>` + cloud("#6f6f73", 3, 3, 0.85);
  else if (c === 3) g = cloud("#4a4a4e");
  else if (c === 45 || c === 48) g = cloud("#4a4a4e", 0, -3) + [6, 9.5, 13].map(yy => `<path d="M-9,${yy} q3,-2 6,0 t6,0 t6,0" fill="none" stroke="#4a4a4e" stroke-width="1.5"/>`).join("");
  else if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) g = cloud("#8a8f96", 0, -3) + `<path d="M0,6 q-3.5,4.5 0,6.5 q3.5,-2 0,-6.5 Z" fill="#1e88e5"/>`;
  else if ((c >= 71 && c <= 77) || c === 85 || c === 86) g = cloud("#8a8f96", 0, -3) + `<text x="0" y="14" text-anchor="middle" font-size="10" fill="#1e88e5">✱</text>`;
  else if (c >= 95) g = cloud("#4a4a4e", 0, -3) + `<path d="M1,5 L-3,11 L0,11 L-2,16 L4,9 L1,9 L3,5 Z" fill="#ffc400"/>`;
  else g = cloud("#4a4a4e");
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}

/* ===================== Pfeil ===================== */
const ARROW = "M0,-9 L6.5,7.5 L0,3.5 L-6.5,7.5 Z"; // zeigt nach oben; gedreht in Windrichtung (wohin er weht)
function arrowSvg(x, y, ws, wd, size, fill, stroke, sw, attrs = "") {
  const hollow = ws < CONFIG.hollowBelow;
  const s = size / 18;
  return `<path d="${ARROW}" ${attrs} transform="translate(${x},${y}) rotate(${(wd + 180) % 360}) scale(${s})"
    fill="${hollow ? "#fff" : fill}" stroke="${stroke}" stroke-width="${sw / s}" stroke-linejoin="round"/>`;
}

/* ===================== Zeichnen ===================== */
let RECS = [], DAYS = [], CUR = 0, RUN = null, LAYOUT = null;

function render() {
  closePopup();
  const day = DAYS[CUR]; if (!day) return;
  const [y, m, d] = day.split("-").map(Number);
  const tw = civilTwilight(y, m, d, SITE.lat, SITE.lon);
  const off = (RECS.utcOffset || 0) / 60;
  const h0 = Math.floor((tw.dawn + off) / 60), h1 = Math.floor((tw.dusk + off) / 60);
  const hrs = RECS.filter(r => r.date === day && r.hour >= h0 && r.hour <= h1);
  if (!hrs.length) { $("chart").innerHTML = ""; setStatus("Für diesen Tag liegen keine Modelldaten vor.", true); return; }
  setStatus("");

  const models = [...new Set(hrs.map(r => r.model))].join(" / ");
  $("runinfo").textContent = models + (RUN && models.includes("D2") ? " · Lauf " + RUN.toLocaleString("de-DE", { day:"2-digit", month:"2-digit", hour:"2-digit" }) + " Uhr" : "") + (DEMO ? " · TESTDATEN" : "");

  const W = $("chartWrap").clientWidth || 800;
  lastW = W;
  const mobile = W < 600;
  const left = mobile ? 46 : 62, right = 6;
  const n = hrs.length;
  const colW = Math.max(mobile ? 27 : 46, Math.floor((W - left - right) / n));
  const totalW = left + right + n * colW;
  const cx = i => left + i * colW + colW / 2;

  // vertikaler Aufbau
  const yHour = 14, yIcon = 40, yTemp = 64;
  const rowH = 13, yH = 76, yM = yH + rowH + 1, yT = yM + rowH + 1, yRain = yT + rowH + 2;
  const yProfTop = yRain + 18;
  const profH = mobile ? 340 : 440;
  const yProfBot = yProfTop + profH;
  const yDir = yProfBot + 6, yWind = yDir + 34, yGust = yWind + 26, yTs = yGust + 26, yBase = yTs + 24, H = yBase + 24;

  // Höhenbereich
  const ground = Math.min(...hrs.map(r => r.ground));
  const below = SITE.alt <= ground + 10;
  const maxBase = Math.max(...hrs.map(r => r.base ? r.base.base : 0));
  const zMin = below ? Math.floor((SITE.alt - 80) / 50) * 50 : Math.floor(ground / 50) * 50;
  const zMax = Math.min(5000, Math.ceil(Math.max(SITE.alt + 1100, maxBase + 300, zMin + 1200) / 100) * 100);
  const yz = z => yProfBot - (z - zMin) / (zMax - zMin) * profH;
  LAYOUT = { cx, colW, yz, hrs, totalW, H, yDir, yWind, yGust, yTs, yBase };

  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${H}" viewBox="0 0 ${totalW} ${H}" id="svg">`);
  o.push(`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f3f3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d4d4d4" stroke-width="2"/></pattern></defs>`);
  o.push(`<rect id="bg" x="0" y="0" width="${totalW}" height="${H}" fill="#fff"/>`);

  // Stunden, Symbole, Temperatur
  hrs.forEach((r, i) => {
    o.push(`<text x="${cx(i)}" y="${yHour}" text-anchor="middle" font-size="${mobile ? 12 : 15}">${r.hour}</text>`);
    o.push(`<line x1="${cx(i)}" y1="${yHour + 4}" x2="${cx(i)}" y2="${yHour + 10}" stroke="#999"/>`);
    o.push(iconSvg(r.code, r.isDay, cx(i), yIcon, mobile ? 0.95 : 1.25));
    if (r.T2 != null) o.push(`<text x="${cx(i)}" y="${yTemp}" text-anchor="middle" font-size="${mobile ? 11 : 13}" fill="#444">${Math.round(r.T2)}°</text>`);
  });

  // Wolken H/M/T + Regen
  const lbl = (txt, yy, fs = 12) => o.push(`<text x="${left - 6}" y="${yy}" text-anchor="end" font-size="${fs}" fill="#333">${txt}</text>`);
  o.push(`<text transform="translate(${mobile ? 9 : 14},${yM + rowH / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#555">Wolken</text>`);
  [["H", yH, "ccH", "#ffffff"], ["M", yM, "ccM", "#000000"], ["T", yT, "ccL", "#000000"]].forEach(([t, yy, k, full]) => {
    lbl(t, yy + rowH - 2);
    hrs.forEach((r, i) => {
      const cc = clamp((r[k] || 0) / 100, 0, 1);
      o.push(`<rect x="${left + i * colW}" y="${yy}" width="${colW + 0.5}" height="${rowH}" fill="${mix("#a9d2fb", full, cc)}"/>`);
    });
  });
  lbl("Regen", yRain + 11, 11);
  hrs.forEach((r, i) => {
    const mm = r.precip || 0;
    const fill = mm >= 0.1 ? mix("#e3d5f1", "#6a2c91", clamp(mm / 3, 0, 1)) : "#f4f8fc";
    o.push(`<rect x="${left + i * colW}" y="${yRain}" width="${colW + 0.5}" height="14" fill="${fill}"/>`);
    if (mm >= 0.1) o.push(`<text x="${cx(i)}" y="${yRain + 11}" text-anchor="middle" font-size="10.5" fill="${mm > 1.5 ? "#fff" : "#3b1a55"}">${mm.toFixed(1)}</text>`);
  });

  // Höhenachse + Gitter
  const tick = (zMax - zMin) > 2500 ? 500 : 250;
  for (let z = Math.ceil(zMin / tick) * tick; z <= zMax; z += tick) {
    const yy = yz(z);
    o.push(`<line x1="${left}" y1="${yy}" x2="${totalW - right}" y2="${yy}" stroke="#e6e6e6"/>`);
    o.push(`<text x="${left - 5}" y="${yy + 4}" text-anchor="end" font-size="${mobile ? 10.5 : 13}" fill="#333">${z.toLocaleString("de-DE")}</text>`);
  }
  const firstTick = Math.ceil(zMin / tick) * tick;
  if (firstTick !== zMin && yProfBot - yz(firstTick) > 18)
    o.push(`<text x="${left - 5}" y="${yProfBot + 2}" text-anchor="end" font-size="${mobile ? 10.5 : 13}" fill="#333">${zMin.toLocaleString("de-DE")}</text>`);

  // Profilspalten: Hintergrund, Wolkendichte nach Höhe
  hrs.forEach((r, i) => {
    const x = left + i * colW + 2, w = colW - 4;
    o.push(`<rect x="${x}" y="${yProfTop}" width="${w}" height="${profH}" rx="5" fill="#f3f3f3"/>`);
    if (r.ground > zMin) o.push(`<rect x="${x}" y="${yz(r.ground)}" width="${w}" height="${yProfBot - yz(r.ground)}" fill="url(#hatch)"/>`);
    for (let z = Math.max(zMin, r.ground); z < zMax; z += 50) {
      const pz = prof(r, z + 25); if (!pz) continue;
      const cc = clamp(pz.cc || 0, 0, 100);
      if (cc < 3) continue;
      const g = Math.round(243 - cc / 100 * 228);
      o.push(`<rect x="${x}" y="${yz(Math.min(z + 50, zMax))}" width="${w}" height="${yz(z) - yz(Math.min(z + 50, zMax)) + 0.4}" fill="rgb(${g},${g},${g})"/>`);
    }
  });

  // Startplatzhöhe
  const ySt = yz(SITE.alt);
  o.push(`<line x1="${left}" y1="${ySt}" x2="${totalW - right}" y2="${ySt}" stroke="#ffb300" stroke-width="2"/>`);
  if (below) {
    o.push(`<line x1="${left}" y1="${yz(ground)}" x2="${totalW - right}" y2="${yz(ground)}" stroke="#888" stroke-dasharray="4 3"/>`);
  }

  // Windpfeile im Profil
  const span = zMax - zMin;
  const step = [50, 100, 150, 200, 250, 300, 500].find(s => s / span * profH >= (mobile ? 17 : 21)) || 500;
  const aSize = Math.min(mobile ? 13 : 17, colW * 0.55);
  hrs.forEach((r, i) => {
    for (let z = Math.ceil((r.ground + 30) / step) * step; z <= zMax - step * 0.4; z += step) {
      if (z < zMin) continue;
      const p = prof(r, z); if (!p) continue;
      const f = windColor(p.ws), gc = gustColor(gustAt(r, z, p.ws));
      o.push(arrowSvg(cx(i), yz(z), p.ws, p.wd, aSize, f, gc === f ? darker(f) : gc, gc === f ? 1.1 : 1.7, `class="hit" data-k="p" data-i="${i}" data-z="${z}"`));
    }
  });

  // Basislinie
  const pts = hrs.map((r, i) => r.base ? [cx(i), yz(clamp(r.base.base, zMin, zMax))] : null).filter(Boolean);
  if (pts.length > 1) {
    let dpath = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      dpath += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
    }
    o.push(`<path d="${dpath}" fill="none" stroke="#6d6d6d" stroke-width="2.5" stroke-linecap="round" pointer-events="none"/>`);
  }

  // Beschriftung Startplatz (über Pfeilen)
  const stTxt = below ? "Startplatz unterhalb Modellhöhe" : "Startplatzhöhe";
  o.push(`<text x="${left + 4}" y="${ySt - 4}" font-size="${mobile ? 11 : 13}" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke" pointer-events="none">${stTxt}</text>`);

  // Startplatz-Zeilen
  lbl(mobile ? "Richt." : "Richtung", yDir + 21); lbl("Wind", yWind + 17); lbl(mobile ? "Böen" : "Max Wind", yGust + 17); lbl("T Start", yTs + 16); lbl("Basis", yBase + 16);
  hrs.forEach((r, i) => {
    const s = r.start, x = left + i * colW + 1.5, w = colW - 3, fs = mobile ? 11 : 14;
    if (!s || s.ws == null) return;
    const wf = windColor(s.ws), gf = gustColor(s.gust);
    o.push(`<rect x="${x}" y="${yDir}" width="${w}" height="30" fill="transparent" class="hit" data-k="s" data-i="${i}"/>`);
    o.push(arrowSvg(cx(i), yDir + 15, s.ws, s.wd, mobile ? 18 : 24, wf, gf, 2, `class="hit" data-k="s" data-i="${i}"`));
    o.push(`<rect x="${x}" y="${yWind}" width="${w}" height="23" fill="${wf}" class="hit" data-k="s" data-i="${i}"/>`);
    o.push(`<text x="${cx(i)}" y="${yWind + 16.5}" text-anchor="middle" font-size="${fs}" fill="${textOn(wf)}" pointer-events="none">${Math.round(s.ws)}</text>`);
    o.push(`<rect x="${x}" y="${yGust}" width="${w}" height="23" fill="${gf}" class="hit" data-k="s" data-i="${i}"/>`);
    o.push(`<text x="${cx(i)}" y="${yGust + 16.5}" text-anchor="middle" font-size="${fs}" fill="${textOn(gf)}" pointer-events="none">${Math.round(s.gust)}</text>`);
    o.push(`<rect x="${x}" y="${yTs}" width="${w}" height="21" fill="#efefef"/>`);
    o.push(`<text x="${cx(i)}" y="${yTs + 15}" text-anchor="middle" font-size="${fs}" fill="#333">${s.T != null ? Math.round(s.T) : "–"}</text>`);
    o.push(`<rect x="${x}" y="${yBase}" width="${w}" height="21" fill="#efefef" class="hit" data-k="s" data-i="${i}"/>`);
    const bt = r.base ? r.base.base : "–";
    o.push(`<text x="${cx(i)}" y="${yBase + 15}" text-anchor="middle" font-size="${mobile ? 10 : 14}" fill="${r.base && !r.base.cumulus ? "#1565c0" : "#333"}" pointer-events="none">${bt}</text>`);
  });

  o.push(`<g id="sel" pointer-events="none"></g></svg>`);
  $("chart").innerHTML = o.join("");
}

/* ===================== Popup ===================== */
function closePopup() { $("popup").hidden = true; const s = document.getElementById("sel"); if (s) s.innerHTML = ""; }

function openPopup(kind, i, z, ax, ay) {
  const r = LAYOUT.hrs[i]; const pop = $("popup");
  const hh = String(r.hour).padStart(2, "0") + ":00";
  const f1 = v => v == null ? "–" : Math.round(v);
  let html = "";
  if (kind === "p") {
    const p = prof(r, z);
    html = `<div class="t">Wind ${hh}<span>${z.toLocaleString("de-DE")} m</span></div>
      <div class="g"><div>Wind</div><div><b>${f1(p.ws)} km/h</b></div>
      <div>Böen</div><div><b>${f1(gustAt(r, z, p.ws))} km/h</b> (geschätzt)</div>
      <div>Richtung</div><div>${f1(p.wd)}° (${dirName(p.wd)})</div>
      <div>Temperatur</div><div>${p.T != null ? p.T.toFixed(1) : "–"} °C</div>
      <div>Taupunkt</div><div>${p.Td != null ? p.Td.toFixed(1) : "–"} °C</div>
      <div>Rel. Luftf.</div><div>${f1(p.RH)} %</div>
      <div>Bewölkung</div><div>${f1(p.cc)} %</div>
      <div>Luftdruck</div><div>${f1(p.p)} hPa</div></div>
      <div class="note">${r.model} · Wind und Temperatur auf gegebener Höhe, ohne Talwind. Böen geschätzt aus dem Böenanteil am Modellboden und der Thermikhöhe.</div>`;
  } else {
    const s = r.start;
    html = `<div class="t">Startplatz ${hh}<span>${SITE.alt.toLocaleString("de-DE")} m</span></div>
      <div class="g"><div>Wind</div><div><b>${f1(s.ws)} km/h</b></div>
      <div>Böen</div><div><b>${f1(s.gust)} km/h</b>${s.gustEstimated ? " (geschätzt)" : ""}</div>
      <div>Richtung</div><div>${f1(s.wd)}° (${dirName(s.wd)})</div>
      <div>Temperatur</div><div>${s.T != null ? s.T.toFixed(1) : "–"} °C</div>
      <div>Taupunkt</div><div>${s.Td != null ? s.Td.toFixed(1) : "–"} °C</div>
      <div>Basis</div><div>${r.base ? r.base.base + " m" + (r.base.cumulus ? " (Wolkenbasis)" : " (blau, ohne Wolken)") : "–"}</div>
      <div>Modellgrund</div><div>${Math.round(r.ground)} m</div></div>
      <div class="note">${r.model} · ${s.below ? "Startplatz liegt unter der Modellhöhe – es wird der Wind an der Untergrenze des Modells (10 m über Modellgrund) verwendet." : "Wind auf Startplatzhöhe aus dem Höhenprofil. Böen geschätzt aus dem Böenanteil am Modellboden und der Thermikhöhe."}</div>`;
  }
  pop.innerHTML = `<button class="x" aria-label="Schließen">×</button>` + html;
  pop.hidden = false;
  pop.querySelector(".x").onclick = closePopup;

  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const gap = 26;
  let px = ax + gap; let side = "r";
  if (px + pw > LAYOUT.totalW - 4) { px = ax - gap - pw; side = "l"; }
  if (px < 2) { px = 2; }
  let py = clamp(ay - ph / 2, 2, LAYOUT.H - ph - 2);
  pop.style.left = px + "px"; pop.style.top = py + "px";

  // optische Verbindung: Rahmen um den Pfeil, gestrichelte Spalte, Linie zum Fenster
  const box = kind === "p" ? 13 : 16;
  const ex = side === "r" ? px : px + pw;
  const ey = clamp(ay, py + 10, py + ph - 10);
  const sx = side === "r" ? ax + box : ax - box;
  document.getElementById("sel").innerHTML =
    `<line x1="${ax}" y1="0" x2="${ax}" y2="${LAYOUT.H}" stroke="#555" stroke-dasharray="3 3" stroke-width="1"/>
     <rect x="${ax - box}" y="${ay - box}" width="${box * 2}" height="${box * 2}" rx="5" fill="none" stroke="#111" stroke-width="2.2"/>
     <rect x="${ax - box + 2.2}" y="${ay - box + 2.2}" width="${box * 2 - 4.4}" height="${box * 2 - 4.4}" rx="3.5" fill="none" stroke="#fff" stroke-width="1.2"/>
     <line x1="${sx}" y1="${ay}" x2="${ex}" y2="${ey}" stroke="#0b2e59" stroke-width="2"/>`;
}

$("chartWrap").addEventListener("click", e => {
  const t = e.target.closest("[data-k]");
  if (!t) { if (!e.target.closest("#popup")) closePopup(); return; }
  const i = +t.dataset.i, kind = t.dataset.k;
  if (kind === "p") {
    const z = +t.dataset.z;
    openPopup("p", i, z, LAYOUT.cx(i), LAYOUT.yz(z));
  } else {
    openPopup("s", i, null, LAYOUT.cx(i), LAYOUT.yDir + 15);
  }
});

/* ===================== Kopf, Tage, Info, Legende ===================== */
function setStatus(t, err) { const s = $("status"); s.textContent = t; s.className = err ? "err" : ""; s.style.display = t ? "" : "none"; }
const navUrl = (lat, lon) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=walking`;

function setupHeader() {
  $("siteName").textContent = SITE.name;
  $("siteMeta").textContent = `${SITE.alt} m${SITE.dir ? " · Startrichtung " + SITE.dir : ""} · ${SITE.lat.toFixed(4)}, ${SITE.lon.toFixed(4)}`;
  $("lnkNav").href = navUrl(SITE.lat, SITE.lon);
  if (SITE.dhvUrl) $("lnkDhv").href = SITE.dhvUrl; else $("lnkDhv").style.display = "none";
  if (!SITE.info) $("btnInfo").style.display = "none";
  document.title = "Flugwetter – " + SITE.name;
}

function setupDays() {
  const nav = $("days"); nav.innerHTML = "";
  const names = ["Heute", "Morgen"];
  DAYS.forEach((d, i) => {
    const [y, m, dd] = d.split("-");
    const wd = new Date(+y, m - 1, +dd).toLocaleDateString("de-DE", { weekday: "short" });
    const b = document.createElement("button");
    b.textContent = names[i] ? `${names[i]} · ${wd} ${dd}.` : `${wd} ${dd}.${m}.`;
    b.className = i === CUR ? "on" : "";
    b.onclick = () => { CUR = i; [...nav.querySelectorAll("button")].forEach((x, k) => x.className = k === i ? "on" : ""); render(); };
    nav.appendChild(b);
  });
  const ri = document.createElement("span"); ri.id = "runinfo"; nav.appendChild(ri);
}

function setupInfo() {
  $("btnInfo").onclick = () => {
    const row = (k, v) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`;
    let h = `<button class="btn close" id="infoClose">Schließen</button><h2>${esc(SITE.name)}</h2>`;
    if (SITE.info) h += `<table>${Object.entries(SITE.info).map(([k, v]) => row(k, v)).join("")}</table>`;
    if (SITE.gelaende) h += `<h3>Fluggelände</h3><table>${Object.entries(SITE.gelaende).map(([k, v]) => row(k, v)).join("")}</table>`;
    if (SITE.landing && SITE.landing.length) {
      h += `<h3>Landeplätze</h3><table>` + SITE.landing.map(l =>
        `<tr><td>${esc(l.name)}<br>${l.alt} m</td><td>${esc(l.text)}<br><a href="${navUrl(l.lat, l.lon)}" target="_blank" rel="noopener">Navigation</a></td></tr>`).join("") + `</table>`;
    }
    if (SITE.dhvUrl) h += `<p><a href="${SITE.dhvUrl}" target="_blank" rel="noopener">Gelände in der DHV-Datenbank öffnen</a></p>`;
    h += `<div class="src">Quelle: DHV-Geländedatenbank (private Nutzung). Angaben ohne Gewähr – vor Ort Infotafeln und einheimische Piloten beachten.</div>`;
    $("infoCard").innerHTML = h; $("infoPanel").hidden = false;
    $("infoClose").onclick = () => $("infoPanel").hidden = true;
  };
  $("infoPanel").onclick = e => { if (e.target.id === "infoPanel") $("infoPanel").hidden = true; };
}

function setupLegend() {
  const sw = (steps) => {
    const lab = ["< " + steps[0], steps[0] + "–" + steps[1], steps[1] + "–" + steps[2], steps[2] + "–" + steps[3], "≥ " + steps[3]];
    return CONFIG.colors.map((c, i) => `<span class="sw" style="background:${c};color:${textOn(c)}">${lab[i]}</span>`).join("");
  };
  $("legend").innerHTML = `
    <h3>Farben (km/h)</h3>
    <div class="scale">Wind: ${sw(CONFIG.windSteps)}</div>
    <div class="scale">Böen: ${sw(CONFIG.gustSteps)}</div>
    Pfeile zeigen, wohin der Wind weht. Die Füllung zeigt die Windstärke, der Rand die Böen. Unter ${CONFIG.hollowBelow} km/h sind die Pfeile nur umrandet. Graustufen im Profil zeigen die Wolkendichte nach Höhe, die schraffierte Fläche liegt unter dem Modellgelände.
    <h3>Basis (graue Linie)</h3>
    Berechnet aus Temperatur und Taupunkt am Modellboden (125 m je Kelvin Spread) und einem trocken aufsteigenden Luftpaket (+${CONFIG.ueberhitzung} K Überhitzung).
    Es gilt der niedrigere Wert. Eine <span style="color:#1565c0">blaue Zahl</span> bedeutet Blauthermik ohne Wolkenbildung.
    <h3>Daten</h3>
    DWD ICON-D2 (2 km, 48 h) über Open-Meteo, danach automatisch ICON-EU (7 km, bis Tag 5) und ICON-Global (13 km, bis Tag 7). Je weiter in der Zukunft, desto gröber das Modell und unsicherer die Vorhersage.
    Die Druckflächen 925, 900 und 800 hPa interpoliert Open-Meteo bei ICON-D2.
    Böen liefert kein Modell in der Höhe, nur 10 m über Grund. In der Höhe sind sie deshalb geschätzt:
    Der Böenanteil am Boden gilt bis zur Thermikobergrenze und nimmt darüber auf ${CONFIG.gustDecay} m ab, mindestens Wind × ${CONFIG.gustMinFactor}.
    Wetterdaten: Open-Meteo.com (CC BY 4.0), DWD.`;
}

/* ===================== Start ===================== */
async function init() {
  setupHeader(); setupInfo(); setupLegend();
  try {
    let d2 = null, eu = null, gl = null;
    if (DEMO) { d2 = makeDemo("d2"); eu = makeDemo("eu"); gl = makeDemo("gl"); }
    else {
      const [a, b, c, run] = await Promise.allSettled([fetchModel(CONFIG.modelsD2), fetchModel(CONFIG.modelsEU), fetchModel(CONFIG.modelsGL), fetchRun()]);
      d2 = a.status === "fulfilled" ? a.value : null;
      eu = b.status === "fulfilled" ? b.value : null;
      gl = c.status === "fulfilled" ? c.value : null;
      RUN = run.status === "fulfilled" ? run.value : null;
      if (!d2 && !eu && !gl) throw new Error(a.reason ? a.reason.message : "keine Antwort");
    }
    RECS = buildRecords([{ name: "ICON-D2", data: d2 }, { name: "ICON-EU", data: eu }, { name: "ICON-Global", data: gl }]);
    RECS.utcOffset = (d2 || eu || gl).utc_offset_seconds;
    DAYS = [...new Set(RECS.map(r => r.date))].slice(0, CONFIG.days);
    setupDays(); render();
    if (!d2 && !DEMO) setStatus("ICON-D2 nicht verfügbar – es werden gröbere Modelle angezeigt.", true);
  } catch (e) {
    setStatus("Wetterdaten konnten nicht geladen werden: " + e.message, true);
  }
}
let rz, lastW = 0;
window.addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { const w = $("chartWrap").clientWidth; if (Math.abs(w - lastW) > 30) { lastW = w; render(); } }, 200);
});
init();
</script>
